spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  main:
    allow-bean-definition-overriding: true
  application:
    name: auction
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

    database-platform: org.hibernate.dialect.H2Dialect
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  profiles:
    include:
      - jwt
      - payment
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
  packages-to-scan: com.tasksprints.auction.api
logging:
  level:
    org.springframework.scheduling.annotation.AsyncAnnotationBeanPostProcessor: DEBUG
    org.springframework.context.event: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    root: INFO
server:
  port: 8080


org :
  jobrunr:
    job-scheduler:
      enabled: true  # 작업 스케줄러 활성화
    background-job-server:
      enabled: true  # 백그라운드 서버 활성화
#      worker-count: 4 # 스레드 풀 수
    dashboard:
      enabled: true  # 대시보드 활성화
      port: 8000     # 대시보드 포트 (http://localhost:8000)
    database:
      table-prefix: JOBRUNR_  # JobRunr 테이블 접두사


